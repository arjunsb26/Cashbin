<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The colour is set from the paper token at runtime so the tokens stay in one place. -->
    <meta name="theme-color" content="" id="themeColor" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Bin camera</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="phone.css" />
  </head>
  <body>
    <section class="start" id="startScreen">
      <div class="start__brand" id="brandName"></div>
      <div class="start__body">
        <p class="error" id="startError" hidden></p>
        <button type="button" class="button button--primary" id="startButton">Start camera</button>
        <p class="start__hint secondary" id="startHint">
          The camera watches the bin, so every toss gets a photo on its ticket.
        </p>
      </div>
    </section>

    <section class="camera" id="cameraScreen" hidden>
      <video class="camera__video" id="video" playsinline muted></video>

      <div class="status" id="status" data-state="live">
        <button type="button" class="status__pill" id="statusPill" aria-live="polite">
          <span class="status__dot" aria-hidden="true"></span>
          <span id="statusText">Live</span>
        </button>
        <div class="status__tooltip" id="statusTooltip" hidden></div>
        <p class="status__message" id="statusMessage" hidden></p>
      </div>

      <p class="error" id="cameraError" hidden></p>
      <p class="learned" id="learnedLine" hidden></p>

      <button type="button" class="add-toss" id="addToss" hidden>Add a toss</button>

      <!-- Sits under an open sheet so a tap beside the sheet lands somewhere
           known. A tap here puts a result away and leaves a question alone. -->
      <div class="backdrop" id="backdrop" data-open="false" hidden></div>

      <section
        class="sheet"
        id="resultSheet"
        data-open="false"
        data-tone="neutral"
        role="status"
        aria-label="Latest ticket"
      >
        <div class="sheet__band"></div>
        <div class="sheet__body">
          <div class="result__head">
            <h1 class="section-title" id="resultTitle"></h1>
            <span class="secondary" id="resultMass" hidden></span>
          </div>
          <p class="figure result__figure" id="resultFigure"></p>
          <p class="result__line" id="resultLine" hidden></p>
          <p class="result__waiting" id="resultWaiting" hidden></p>
        </div>
      </section>

      <section class="sheet" id="askSheet" data-open="false" data-tone="neutral" aria-label="Question">
        <div class="sheet__band"></div>
        <div class="sheet__body">
          <img class="ask__crop" id="askCrop" alt="Photo of the item" hidden />
          <h1 class="section-title">Which is it?</h1>
          <div class="ask__options" id="askOptions"></div>
          <button type="button" class="button" id="askOther">Something else</button>
          <div class="field" id="askField" hidden>
            <label class="field__label" for="askInput">What was it</label>
            <span class="field__hint">Letters, digits, spaces and hyphens. Up to 40 characters.</span>
            <input
              class="field__input"
              id="askInput"
              type="text"
              inputmode="text"
              autocomplete="off"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              maxlength="80"
            />
            <span class="field__read-back" id="askReadBack"></span>
            <button type="button" class="button button--primary" id="askSend" disabled>Send answer</button>
          </div>
          <button type="button" class="button ask__not-now" id="askNotNow">Not now</button>
          <p class="ask__note" id="askNote" hidden></p>
          <p class="ask__waiting" id="askWaiting" hidden></p>
        </div>
      </section>

      <section class="sheet" id="addSheet" data-open="false" data-tone="neutral" aria-label="Add a toss">
        <div class="sheet__band"></div>
        <div class="sheet__body">
          <h1 class="section-title">Add a toss</h1>
          <div class="field">
            <label class="field__label" for="addInput">Weight in grams</label>
            <span class="field__hint">About how much it weighs. The camera picture from right now is the photo.</span>
            <input
              class="field__input"
              id="addInput"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              autocorrect="off"
              spellcheck="false"
              maxlength="6"
              value="150"
            />
          </div>
          <p class="add__note" id="addNote" hidden></p>
          <div class="add__actions">
            <button type="button" class="button add__cancel" id="addCancel">Cancel</button>
            <button type="button" class="button button--primary add__send" id="addSend">Add</button>
          </div>
        </div>
      </section>
    </section>

    <script src="phone.js"></script>
  </body>
</html>
