[project]
name = "binbooks-backend"
version = "0.1.0"
description = "BinBooks backend: ingest, identify, score, post, close."

requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.36",
    "hypercorn>=0.17",
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
    "websockets>=13",
    "cryptography>=43",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "openai>=3.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "trio>=0.27",
    "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", ".."]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "SIM",
    "RUF",
    "ANN",
]
ignore = [
    "ANN401",
    "RUF012",
    # FastAPI declares Query, Path and Depends in argument defaults. That is the framework.
    "B008",
    # Annotated type aliases with a discriminator need TypeAlias, not the 3.12 type keyword.
    "UP040",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "scripts"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001"]
# The attack set is made of confusable characters on purpose.
"tests/attack_set.py" = ["RUF001", "RUF002", "RUF003"]
# Repo scripts put the backend on sys.path before they import from it.
"**/scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cv2.*", "hypercorn.*", "scripts.*", "sim.*"]
ignore_missing_imports = true
